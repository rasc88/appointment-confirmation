# One environment on the EC2 instance. infra/deploy.sh runs it as project
# ac-dev or ac-prod with that environment's .env (decision 37). Production
# uses this file alone, so it has no seed step.

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: appointments
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appointments"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging

  app:
    image: ${IMAGE}
    ports:
      - "${HOST_PORT}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      APP_ENV: ${APP_ENV}
      SESSION_SECRET: ${SESSION_SECRET}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    init: true
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  db-data:
