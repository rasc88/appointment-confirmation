  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - unauthenticated
                - invalid_credentials
                - cross_site_request
                - not_found
                - invalid_transition
                - appointment_started
                - appointment_not_started
                - email_taken
                - cannot_deactivate_self
                - validation_error
                - rate_limited
                - internal_error
            message:
              type: string
              description: Human-readable explanation.
            field:
              type: string
              description: |
                Present only on 422. Names the request field that failed, for
                example `durationMinutes`, `messageTemplate`, or the query
                parameter `date`.

    Timestamp:
      type: string
      format: date-time
      description: UTC (`Z`) in responses.

    Actor:
      type: [string, 'null']
      enum: [client, staff, null]

    AppointmentStatus:
      type: string
      enum: [pending, confirmed, cancelled, attended, no_show]

    StaffMember:
      type: object
      additionalProperties: false
      required: [id, name, email, isActive, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
        email:
          type: string
          format: email
        isActive:
          type: boolean
        createdAt:
          $ref: '#/components/schemas/Timestamp'

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    CreateStaffMemberRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 72

    UpdateStaffMemberRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        isActive:
          type: boolean

    Client:
      type: object
      required: [id, name, phone, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
        phone:
          type: [string, 'null']
        createdAt:
          $ref: '#/components/schemas/Timestamp'

    CreateClientRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        phone:
          type: [string, 'null']
          maxLength: 30
          pattern: '^[0-9+() -]+$'

    ClientDetail:
      allOf:
        - $ref: '#/components/schemas/Client'
        - type: object
          required: [noShowCount, appointments]
          properties:
            noShowCount:
              type: integer
              minimum: 0
              description: All-time count of the client's `no_show` appointments.
            appointments:
              type: array
              description: The client's appointments, newest `startsAt` first.
              items:
                $ref: '#/components/schemas/Appointment'

    Appointment:
      type: object
      required:
        - id
        - client
        - staffMember
        - service
        - startsAt
        - durationMinutes
        - status
        - confirmedBy
        - cancelledBy
        - statusChangedAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        client:
          type: object
          required: [id, name, phone]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            phone:
              type: [string, 'null']
        staffMember:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        service:
          type: string
          minLength: 1
          maxLength: 80
        startsAt:
          $ref: '#/components/schemas/Timestamp'
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 480
        status:
          $ref: '#/components/schemas/AppointmentStatus'
        confirmedBy:
          $ref: '#/components/schemas/Actor'
        cancelledBy:
          $ref: '#/components/schemas/Actor'
        statusChangedAt:
          $ref: '#/components/schemas/Timestamp'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    DayView:
      type: object
      required: [date, timeZone, appointments]
      properties:
        date:
          type: string
          format: date
        timeZone:
          type: string
          description: The business time zone (IANA), for example `Europe/Madrid`.
        appointments:
          type: array
          description: Sorted by `startsAt`.
          items:
            $ref: '#/components/schemas/DayAppointment'

    DayAppointment:
      allOf:
        - $ref: '#/components/schemas/Appointment'
        - type: object
          required: [atRiskReasons, isLateCancellation]
          properties:
            atRiskReasons:
              type: array
              description: Empty unless the status is `pending` or `confirmed` and `startsAt` is after the current time.
              items:
                $ref: '#/components/schemas/AtRiskReason'
            isLateCancellation:
              type: boolean
              description: |
                `true` only for a `cancelled` appointment cancelled less than
                `lateCancellationHours` before `startsAt`. Never `true` when
                that setting is 0.

    AtRiskReason:
      oneOf:
        - $ref: '#/components/schemas/NoReplyReason'
        - $ref: '#/components/schemas/NoShowHistoryReason'
      discriminator:
        propertyName: code
        mapping:
          no_reply: '#/components/schemas/NoReplyReason'
          no_show_history: '#/components/schemas/NoShowHistoryReason'

    NoReplyReason:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          enum: [no_reply]

    NoShowHistoryReason:
      type: object
      additionalProperties: false
      required: [code, noShowCount]
      properties:
        code:
          type: string
          enum: [no_show_history]
        noShowCount:
          type: integer
          minimum: 1
          description: |
            The count behind "Missed N before": the client's `no_show`
            appointments in the last `noShowLookbackDays`.

    CreateAppointmentRequest:
      type: object
      additionalProperties: false
      required: [clientId, staffMemberId, service, startsAt]
      properties:
        clientId:
          type: string
          format: uuid
        staffMemberId:
          type: string
          format: uuid
        service:
          type: string
          minLength: 1
          maxLength: 80
        startsAt:
          $ref: '#/components/schemas/Timestamp'
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 480
          description: Defaults to `defaultDurationMinutes` from settings.

    UpdateAppointmentRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        staffMemberId:
          type: string
          format: uuid
        service:
          type: string
          minLength: 1
          maxLength: 80
        startsAt:
          $ref: '#/components/schemas/Timestamp'
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 480

    OutcomeRequest:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [attended, no_show]

    AppointmentWithLink:
      type: object
      required: [appointment, confirmationLink, message]
      properties:
        appointment:
          $ref: '#/components/schemas/Appointment'
        confirmationLink:
          type: string
          format: uri
          description: '`{PUBLIC_BASE_URL}/c/{token}`. Returned only once.'
        message:
          type: string
          description: The settings `messageTemplate` rendered with this link.

    PublicAppointment:
      type: object
      additionalProperties: false
      required:
        - businessName
        - timeZone
        - service
        - staffName
        - startsAt
        - durationMinutes
        - status
        - hasStarted
      properties:
        businessName:
          type: string
        timeZone:
          type: string
          description: The business time zone (IANA), for example `Europe/Madrid`.
        service:
          type: string
        staffName:
          type: string
        startsAt:
          $ref: '#/components/schemas/Timestamp'
        durationMinutes:
          type: integer
        status:
          $ref: '#/components/schemas/AppointmentStatus'
        hasStarted:
          type: boolean
          description: Computed by the server, so a wrong phone clock does not matter.

    BusinessSettings:
      type: object
      required:
        - businessName
        - timeZone
        - noReplyWindowHours
        - noShowThreshold
        - noShowLookbackDays
        - lateCancellationHours
        - defaultDurationMinutes
        - messageTemplate
        - updatedAt
      properties:
        businessName:
          type: string
          default: My Business
        timeZone:
          type: string
          default: UTC
          description: An IANA zone, for example `Europe/Madrid`.
        noReplyWindowHours:
          type: integer
          default: 24
        noShowThreshold:
          type: integer
          default: 1
        noShowLookbackDays:
          type: integer
          default: 180
        lateCancellationHours:
          type: integer
          default: 12
          description: 0 turns the late cancellation flag off.
        defaultDurationMinutes:
          type: integer
          default: 30
        messageTemplate:
          type: string
          default: 'Hi {client}, this is {business}. Please confirm your {service} appointment on {date} at {time}: {link}'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    UpdateSettingsRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        businessName:
          type: string
          minLength: 1
          maxLength: 80
        timeZone:
          type: string
          description: Must be an IANA zone, checked by the server (422 otherwise).
        noReplyWindowHours:
          type: integer
          minimum: 1
          maximum: 168
        noShowThreshold:
          type: integer
          minimum: 1
          maximum: 10
        noShowLookbackDays:
          type: integer
          minimum: 7
          maximum: 730
        lateCancellationHours:
          type: integer
          minimum: 0
          maximum: 168
          description: 0 turns the late cancellation flag off.
        defaultDurationMinutes:
          type: integer
          minimum: 5
          maximum: 480
        messageTemplate:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '\{link\}'
          description: |
            Must contain `{link}`, and may use only the placeholders
            `{client}`, `{business}`, `{service}`, `{staff}`, `{date}`,
            `{time}`, `{link}`. The placeholders are checked by the server
            (422 otherwise).

    Health:
      type: object
      required: [status, environment, version]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        environment:
          type: string
        version:
          type: string
