openapi: 3.1.0
info:
  title: Appointment Confirmation API
  version: 1.0.0
  description: |
    Staff of a small service business record appointments and send each
    client a private link to confirm or cancel. See `docs/spec.md` section 12.

    Every error uses the shared `Error` shape. Every timestamp is an ISO 8601
    date-time, sent in UTC (`Z`) in responses.
servers:
  - url: /v1
    description: Same origin as the web app.
security:
  - sessionCookie: []
tags:
  - name: auth
    description: Sign in, sign out, and the current staff member.
  - name: staff
    description: Staff accounts.
  - name: clients
    description: Clients and their appointment history.
  - name: appointments
    description: The day view and every staff action on an appointment.
  - name: settings
    description: Business settings (spec section 6.7).
  - name: public
    description: The client page behind a confirmation link. No session.
  - name: operations
    description: Health check.

paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with email and password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in. The session cookie is set.
          headers:
            Set-Cookie:
              description: |
                The session cookie:
                `session=<signed token>; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=43200`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMember'
              examples:
                StaffMemberAlex:
                  $ref: '#/components/examples/StaffMemberAlex'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out and clear the session cookie.
      description: Returns 204 whether or not a valid session was sent, so an expired session can still sign out.
      security: []
      responses:
        '204':
          description: Signed out. Returned whether or not a valid session was sent.
          headers:
            Set-Cookie:
              description: |
                Clears the session cookie:
                `session=; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=0`.
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/me:
    get:
      tags: [auth]
      operationId: getCurrentStaffMember
      summary: Get the signed-in staff member.
      responses:
        '200':
          description: The signed-in staff member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMember'
              examples:
                StaffMemberAlex:
                  $ref: '#/components/examples/StaffMemberAlex'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /staff:
    get:
      tags: [staff]
      operationId: listStaff
      summary: List every staff account, active and inactive.
      responses:
        '200':
          description: All staff accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffMember'
              example:
                - id: 0b8f6a52-3c1e-4d7a-9f20-6e5b1c2d3a41
                  name: Alex
                  email: alex@demo.test
                  isActive: true
                  createdAt: '2026-11-01T08:00:00Z'
                - id: 5d2c7e19-8a4b-4f63-b0d5-1e9a7c3f2b86
                  name: Sam
                  email: sam@demo.test
                  isActive: true
                  createdAt: '2026-11-01T08:05:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [staff]
      operationId: createStaffMember
      summary: Add a staff account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffMemberRequest'
      responses:
        '201':
          description: The new staff account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMember'
              example:
                id: 9e4a1f37-2b6c-4d85-a0e3-7c5f8b2d1e90
                name: Jordan
                email: jordan@demo.test
                isActive: true
                createdAt: '2026-11-10T09:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
          description: |
            `email_taken`: another staff account already has this email,
            compared case-insensitively.
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /staff/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [staff]
      operationId: updateStaffMember
      summary: Rename or deactivate a staff account.
      description: |
        Deactivating (`isActive: false`) blocks sign-in, hides the account
        from the staff picker, and ends its existing sessions: its next
        request returns 401. Nobody can deactivate themselves.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStaffMemberRequest'
      responses:
        '200':
          description: The updated staff account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMember'
              example:
                id: 5d2c7e19-8a4b-4f63-b0d5-1e9a7c3f2b86
                name: Sam
                email: sam@demo.test
                isActive: false
                createdAt: '2026-11-01T08:05:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: |
            `cannot_deactivate_self`: the body sets `isActive: false` on the
            caller's own id.
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /clients:
    get:
      tags: [clients]
      operationId: searchClients
      summary: Search clients by name or phone.
      parameters:
        - name: q
          in: query
          required: false
          description: |
            Matches the client's name or phone, case-insensitively, by
            substring. A client with a `null` phone is matched by name only.
            Returns at most 20 clients, sorted by name. Without `q`, returns
            the first 20 clients by name.
          schema:
            type: string
            minLength: 1
            maxLength: 80
      responses:
        '200':
          description: At most 20 matching clients, sorted by name.
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items:
                  $ref: '#/components/schemas/Client'
              example:
                - id: 3f7b2c91-6d4e-4a58-8b1f-2e9c0a7d5b63
                  name: Maria Lopez
                  phone: +34 600 123 456
                  createdAt: '2026-10-02T10:15:00Z'
                - id: 7a1d4e82-9c3b-4f60-a5e7-8b2f1c6d0e94
                  name: Mario Rossi
                  phone: null
                  createdAt: '2026-10-05T16:40:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [clients]
      operationId: createClient
      summary: Create a client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientRequest'
      responses:
        '201':
          description: The new client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
              example:
                id: 3f7b2c91-6d4e-4a58-8b1f-2e9c0a7d5b63
                name: Maria Lopez
                phone: +34 600 123 456
                createdAt: '2026-11-10T09:12:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /clients/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [clients]
      operationId: getClient
      summary: Get a client with their appointment history and no-show count.
      responses:
        '200':
          description: The client, their appointments (newest first), and their all-time no-show count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDetail'
              example:
                id: 3f7b2c91-6d4e-4a58-8b1f-2e9c0a7d5b63
                name: Maria Lopez
                phone: +34 600 123 456
                createdAt: '2026-10-02T10:15:00Z'
                noShowCount: 1
                appointments:
                  - id: 2c8f5a17-4b9e-4d36-a1c0-9e7d3b5f8a24
                    client:
                      id: 3f7b2c91-6d4e-4a58-8b1f-2e9c0a7d5b63
                      name: Maria Lopez
                      phone: +34 600 123 456
                    staffMember:
                      id: 0b8f6a52-3c1e-4d7a-9f20-6e5b1c2d3a41
                      name: Alex
                    service: Haircut
                    startsAt: '2026-11-11T09:30:00Z'
                    durationMinutes: 30
                    status: pending
                    confirmedBy: null
                    cancelledBy: null
                    statusChangedAt: '2026-11-10T09:15:00Z'
                    createdAt: '2026-11-10T09:15:00Z'
                    updatedAt: '2026-11-10T09:15:00Z'
                  - id: 6b3e9d14-7f2a-4c85-9e01-4d8a2b7c5f36
                    client:
                      id: 3f7b2c91-6d4e-4a58-8b1f-2e9c0a7d5b63
                      name: Maria Lopez
                      phone: +34 600 123 456
                    staffMember:
                      id: 0b8f6a52-3c1e-4d7a-9f20-6e5b1c2d3a41
                      name: Alex
                    service: Haircut
                    startsAt: '2026-10-20T15:00:00Z'
                    durationMinutes: 30
                    status: no_show
                    confirmedBy: null
                    cancelledBy: null
                    statusChangedAt: '2026-10-20T16:00:00Z'
                    createdAt: '2026-10-15T09:00:00Z'
                    updatedAt: '2026-10-20T16:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /appointments:
    get:
      tags: [appointments]
      operationId: getDayView
      summary: List one day's appointments with their at-risk reasons.
      parameters:
        - name: date
          in: query
          required: false
          description: |
            The day to show, `YYYY-MM-DD`. Defaults to today in the business
            time zone. The day runs from 00:00 to 24:00 local time in that
            zone, so it can be 23 or 25 hours long around a DST change. A
            malformed `date` is 422 with `field: date`.
          schema:
            type: string
            format: date
        - name: staffId
          in: query
          required: false
          description: |
            Only this staff member's appointments. A malformed `staffId` is
            422 with `field: staffId`. An unknown `staffId` returns an empty
            list.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The day's appointments, sorted by `startsAt`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayView'
              example:
                date: '2026-11-11'
                timeZone: Europe/Madrid
                appointments:
                  - id: 2c8f5a17-4b9e-4d36-a1c0-9e7d3b5f8a24
                    client:
                      id: 3f7b2c91-6d4e-4a58-8b1f-2e9c0a7d5b63
                      name: Maria Lopez
                      phone: +34 600 123 456
                    staffMember:
                      id: 0b8f6a52-3c1e-4d7a-9f20-6e5b1c2d3a41
                      name: Alex
                    service: Haircut
                    startsAt: '2026-11-11T09:30:00Z'
                    durationMinutes: 30
                    status: pending
                    confirmedBy: null
                    cancelledBy: null
                    statusChangedAt: '2026-11-10T09:15:00Z'
                    createdAt: '2026-11-10T09:15:00Z'
                    updatedAt: '2026-11-10T09:15:00Z'
                    atRiskReasons:
                      - code: no_reply
                      - code: no_show_history
                        noShowCount: 1
                    isLateCancellation: false
                  - id: 8d4a2e63-1c7f-4b95-b3e8-5a0f9c2d7e41
                    client:
                      id: 7a1d4e82-9c3b-4f60-a5e7-8b2f1c6d0e94
                      name: Mario Rossi
                      phone: null
                    staffMember:
                      id: 5d2c7e19-8a4b-4f63-b0d5-1e9a7c3f2b86
                      name: Sam
                    service: Beard trim
                    startsAt: '2026-11-11T11:00:00Z'
                    durationMinutes: 20
                    status: cancelled
                    confirmedBy: client
                    cancelledBy: client
                    statusChangedAt: '2026-11-11T02:00:00Z'
                    createdAt: '2026-11-09T12:00:00Z'
                    updatedAt: '2026-11-11T02:00:00Z'
                    atRiskReasons: []
                    isLateCancellation: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: |
            `validation_error` with `field` set to `date` or `staffId` when
            that query parameter is malformed.
    post:
      tags: [appointments]
      operationId: createAppointment
      summary: Create an appointment and its confirmation link.
      description: |
        Creates the appointment as `pending` with a fresh confirmation token.
        The link and the rendered message are returned only here and by
        `POST /appointments/{id}/link`, never again (decision 5).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppointmentRequest'
      responses:
        '201':
          description: The new appointment with its link and ready-to-send message, shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentWithLink'
              examples:
                AppointmentWithLink:
                  $ref: '#/components/examples/AppointmentWithLink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: |
            `validation_error`, with `field` naming the request field that
            failed. Besides the schema rules, this covers: `startsAt` not in
            the future (`field: startsAt`), an unknown `clientId`
            (`field: clientId`), and an unknown or inactive `staffMemberId`
            (`field: staffMemberId`).

  /appointments/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [appointments]
      operationId: getAppointment
      summary: Get one appointment.
      description: |
        Returns the appointment in any status. It carries no at-risk reasons
        and no confirmation link: the link is returned only on create and
        regenerate (decision 5).
      responses:
        '200':
          description: The appointment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
              examples:
                AppointmentPending:
                  $ref: '#/components/examples/AppointmentPending'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [appointments]
      operationId: updateAppointment
      summary: Edit an appointment's staff member, service, start time, or duration.
      description: |
        Allowed only while the appointment is `pending` or `confirmed`;
        otherwise 409 `invalid_transition`. The client cannot be changed.
        A `startsAt` different from the current one must be in the future
        (else 422), and an unknown or inactive `staffMemberId` is 422. A
        changed `startsAt` puts the appointment back to `pending` with
        `confirmedBy: null`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppointmentRequest'
      responses:
        '200':
          description: The updated appointment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
              examples:
                AppointmentPending:
                  $ref: '#/components/examples/AppointmentPending'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: |
            `invalid_transition`: the appointment is not `pending` or
            `confirmed`.
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: |
            `validation_error`, with `field` naming the request field that
            failed. Besides the schema rules, this covers: a `startsAt`
            different from the current one that is not in the future
            (`field: startsAt`), and an unknown or inactive `staffMemberId`
            (`field: staffMemberId`).

  /appointments/{id}/confirm:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [appointments]
      operationId: confirmAppointment
      summary: Confirm an appointment on the client's behalf.
      description: |
        Confirms a `pending` appointment before its start time and records
        `confirmedBy: staff`. Confirming an already `confirmed` appointment
        returns 200 with the appointment unchanged.
      responses:
        '200':
          description: The confirmed appointment, or the unchanged one if it was already `confirmed`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
              examples:
                AppointmentConfirmed:
                  $ref: '#/components/examples/AppointmentConfirmed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: |
            `invalid_transition`: the appointment is `cancelled`, `attended`,
            or `no_show`. `appointment_started`: the appointment is `pending`
            and its start time has passed.

  /appointments/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [appointments]
      operationId: cancelAppointment
      summary: Cancel an appointment on the client's behalf.
      description: |
        Cancels a `pending` or `confirmed` appointment and records
        `cancelledBy: staff`. Cancelling an already `cancelled` appointment
        is 409 `invalid_transition` (spec section 7).
      responses:
        '200':
          description: The cancelled appointment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
              examples:
                AppointmentCancelled:
                  $ref: '#/components/examples/AppointmentCancelled'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: |
            `invalid_transition`: the appointment is not `pending` or
            `confirmed`, including when it is already `cancelled`.

  /appointments/{id}/outcome:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [appointments]
      operationId: recordAppointmentOutcome
      summary: Mark an appointment as attended or no-show.
      description: Allowed for a `pending` or `confirmed` appointment once its start time has passed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutcomeRequest'
      responses:
        '200':
          description: The appointment with its outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
              examples:
                AppointmentAttended:
                  $ref: '#/components/examples/AppointmentAttended'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: |
            `invalid_transition`: the appointment is not `pending` or
            `confirmed`. `appointment_not_started`: its start time has not
            passed yet.
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /appointments/{id}/undo-outcome:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [appointments]
      operationId: undoAppointmentOutcome
      summary: Revert an attended or no-show outcome.
      description: |
        Returns an `attended` or `no_show` appointment to its previous
        status: `confirmed` if `confirmedBy` is set, `pending` otherwise.
      responses:
        '200':
          description: The appointment back in its previous status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
              examples:
                AppointmentConfirmed:
                  $ref: '#/components/examples/AppointmentConfirmed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: |
            `invalid_transition`: the appointment is not `attended` or
            `no_show`.

  /appointments/{id}/link:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [appointments]
      operationId: regenerateAppointmentLink
      summary: Regenerate an appointment's confirmation link.
      description: |
        Issues a new token. The previous link stops working immediately and
        returns 404. Regenerating is only allowed while the appointment is
        `pending` or `confirmed` and before its start time. The new link and
        rendered message are returned only in this response.
      responses:
        '200':
          description: The appointment with its new link and ready-to-send message, shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentWithLink'
              examples:
                AppointmentWithLink:
                  $ref: '#/components/examples/AppointmentWithLink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: |
            `invalid_transition`: the appointment is not `pending` or
            `confirmed`. `appointment_started`: its start time has passed.

  /settings:
    get:
      tags: [settings]
      operationId: getSettings
      summary: Get the business settings.
      responses:
        '200':
          description: The business settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessSettings'
              examples:
                BusinessSettings:
                  $ref: '#/components/examples/BusinessSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [settings]
      operationId: updateSettings
      summary: Update one or more business settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSettingsRequest'
      responses:
        '200':
          description: The updated business settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessSettings'
              examples:
                BusinessSettings:
                  $ref: '#/components/examples/BusinessSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: |
            `validation_error`, with `field` naming the setting that failed.
            Besides the schema rules, this covers a `timeZone` that is not an
            IANA zone and a `messageTemplate` with a placeholder other than
            `{client}`, `{business}`, `{service}`, `{staff}`, `{date}`,
            `{time}`, `{link}`.

  /public/appointments/{token}:
    parameters:
      - $ref: '#/components/parameters/Token'
    get:
      tags: [public]
      operationId: getPublicAppointment
      summary: Get the appointment behind a confirmation link.
      description: |
        Returns 200 for every status, including after the start time, when
        `hasStarted` is `true` and the client page shows the read-only "has
        passed" page.
      security: []
      responses:
        '200':
          description: The appointment details for the client page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAppointment'
              examples:
                PublicAppointmentPending:
                  $ref: '#/components/examples/PublicAppointmentPending'
        '404':
          $ref: '#/components/responses/PublicNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /public/appointments/{token}/confirm:
    parameters:
      - $ref: '#/components/parameters/Token'
    post:
      tags: [public]
      operationId: confirmPublicAppointment
      summary: Confirm the appointment behind a confirmation link.
      description: |
        Confirms a `pending` appointment before its start time and records
        `confirmedBy: client`. Confirming an already `confirmed` appointment
        returns 200 with the appointment unchanged. After the start time it
        returns 409 `appointment_started`.
      security: []
      responses:
        '200':
          description: The confirmed appointment, or the unchanged one if it was already `confirmed`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAppointment'
              example:
                businessName: Demo Studio
                timeZone: Europe/Madrid
                service: Haircut
                staffName: Alex
                startsAt: '2026-11-11T09:30:00Z'
                durationMinutes: 30
                status: confirmed
                hasStarted: false
        '404':
          $ref: '#/components/responses/PublicNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: |
            `invalid_transition`: the appointment is `cancelled`, `attended`,
            or `no_show`. `appointment_started`: its start time has passed.
        '429':
          $ref: '#/components/responses/RateLimited'

  /public/appointments/{token}/cancel:
    parameters:
      - $ref: '#/components/parameters/Token'
    post:
      tags: [public]
      operationId: cancelPublicAppointment
      summary: Cancel the appointment behind a confirmation link.
      description: |
        Cancels a `pending` or `confirmed` appointment before its start time
        and records `cancelledBy: client`. Cancelling an already `cancelled`
        appointment is 409 `invalid_transition` (spec section 7). After the
        start time it returns 409 `appointment_started`.
      security: []
      responses:
        '200':
          description: The cancelled appointment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAppointment'
              example:
                businessName: Demo Studio
                timeZone: Europe/Madrid
                service: Haircut
                staffName: Alex
                startsAt: '2026-11-11T09:30:00Z'
                durationMinutes: 30
                status: cancelled
                hasStarted: false
        '404':
          $ref: '#/components/responses/PublicNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: |
            `invalid_transition`: the appointment is not `pending` or
            `confirmed`, including when it is already `cancelled`.
            `appointment_started`: its start time has passed.
        '429':
          $ref: '#/components/responses/RateLimited'

  /health:
    get:
      tags: [operations]
      operationId: getHealth
      summary: Check the database round trip and report the running version.
      security: []
      responses:
        '200':
          description: The database round trip succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                environment: dev
                version: 1.0.0
        '503':
          description: The database round trip failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: unavailable
                environment: dev
                version: 1.0.0

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: |
        The signed session token set by `POST /auth/login`, with the
        attributes `HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=43200`
        (12 hours, spec section 6.1).

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: The resource id. A malformed id returns 404, not 422.
      schema:
        type: string
        format: uuid
    Token:
      name: token
      in: path
      required: true
      description: |
        The URL-safe token from the confirmation link `/c/{token}`, at least
        128 bits of randomness (spec section 6.4).
      schema:
        type: string

  headers:
    RetryAfter:
      description: Seconds to wait before trying again.
      schema:
        type: integer
        minimum: 1

  responses:
    Unauthorized:
      description: |
        `unauthenticated`: no session cookie, an expired or tampered
        session, or the staff member has been deactivated since signing in.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthenticated
              message: Sign in to continue.
    InvalidCredentials:
      description: |
        `invalid_credentials`: a wrong email, a wrong password, or an
        inactive account, all with the same response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: invalid_credentials
              message: Email or password is incorrect.
    Forbidden:
      description: |
        `cross_site_request`: the request carries an `Origin` header that is
        not the app's own origin (spec section 13, reject cross-site
        requests).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: cross_site_request
              message: Cross-site requests are not allowed.
    NotFound:
      description: |
        `not_found`: no resource has this id. A malformed id also returns
        404, not 422.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: Not found.
    PublicNotFound:
      description: |
        `not_found`: identical for an unknown, malformed, or regenerated
        token. It never says whether an appointment exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: This link is not valid.
    Conflict:
      description: |
        The action is not allowed in the appointment's or account's current
        state:

        - `invalid_transition`: any transition not in spec section 7
        - `appointment_started`: a client confirm or cancel, a staff confirm
          of a `pending` appointment, or a link regeneration once the start
          time has passed
        - `appointment_not_started`: an outcome before the start time
        - `email_taken`: a duplicate staff email, compared case-insensitively
        - `cannot_deactivate_self`: `PATCH /staff/{id}` sets
          `isActive: false` on the caller's own id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: invalid_transition
              message: This appointment can no longer be changed.
    ValidationFailed:
      description: |
        `validation_error`: the request failed validation. `field` names the
        request field or query parameter that failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: validation_error
              message: Must be between 5 and 480.
              field: durationMinutes
    RateLimited:
      description: |
        `rate_limited`: too many requests. Sign-in is limited per email and
        IP; public endpoints are limited per IP.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: rate_limited
              message: Too many requests. Try again later.

  examples:
    StaffMemberAlex:
      value:
        id: 0b8f6a52-3c1e-4d7a-9f20-6e5b1c2d3a41
