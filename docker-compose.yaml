name: appointment-confirmation

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appointments
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appointments"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  app:
    build: .
    ports:
      - "8080:3000"
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/appointments
      PUBLIC_BASE_URL: http://localhost:8080
      APP_ENV: local
      SESSION_SECRET: local-compose-only-session-secret-not-for-deploys
    command: ["sh", "-c", "npx prisma migrate deploy && npm run db:seed:if-empty && exec npm start"]
    init: true
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
